name: 🚀 CI Pipeline

on:
  push:
    branches: ['*']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build Docker image
        id: docker_build
        run: docker build -t magic-english-backend .

      - name: 📋 Get commit info
        if: always()
        id: commit_info
        run: |
          echo "message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────
      #  ✅  SLACK — SUCCESS
      # ─────────────────────────────────────────
      - name: ✅ Slack — Success
        if: success()
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
          --data "{
            \"attachments\": [
              {
                \"color\": \"#2EB67D\",
                \"blocks\": [
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*✅ Build passed successfully*\"
                    }
                  },
                  {
                    \"type\": \"divider\"
                  },
                  {
                    \"type\": \"section\",
                    \"fields\": [
                      { \"type\": \"mrkdwn\", \"text\": \"*📦 Repository*\n<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>\" },
                      { \"type\": \"mrkdwn\", \"text\": \"*🌿 Branch*\n\`${{ github.ref_name }}\`\" },
                      { \"type\": \"mrkdwn\", \"text\": \"*👤 Author*\n\`${{ github.actor }}\`\" },
                      { \"type\": \"mrkdwn\", \"text\": \"*🔖 Commit*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|\`${{ steps.commit_info.outputs.sha_short }}\`>\" }
                    ]
                  },
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*💬 Commit message*\n> ${{ steps.commit_info.outputs.message }}\"
                    }
                  },
                  {
                    \"type\": \"actions\",
                    \"elements\": [
                      {
                        \"type\": \"button\",
                        \"text\": { \"type\": \"plain_text\", \"text\": \"🔍 View Run\", \"emoji\": true },
                        \"style\": \"primary\",
                        \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                      },
                      {
                        \"type\": \"button\",
                        \"text\": { \"type\": \"plain_text\", \"text\": \"📂 View Commit\", \"emoji\": true },
                        \"url\": \"${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}\"
                      }
                    ]
                  },
                  {
                    \"type\": \"context\",
                    \"elements\": [
                      { \"type\": \"mrkdwn\", \"text\": \"🕐 ${{ steps.commit_info.outputs.timestamp }}\" }
                    ]
                  }
                ]
              }
            ]
          }" \
          ${{ secrets.SLACK_WEBHOOK }}

      # ─────────────────────────────────────────
      #  ❌  SLACK — FAILURE
      # ─────────────────────────────────────────
      - name: ❌ Slack — Failure
        if: failure()
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
          --data "{
            \"attachments\": [
              {
                \"color\": \"#E01E5A\",
                \"blocks\": [
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*❌ Build failed — Attention required*\"
                    }
                  },
                  {
                    \"type\": \"divider\"
                  },
                  {
                    \"type\": \"section\",
                    \"fields\": [
                      { \"type\": \"mrkdwn\", \"text\": \"*📦 Repository*\n<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>\" },
                      { \"type\": \"mrkdwn\", \"text\": \"*🌿 Branch*\n\`${{ github.ref_name }}\`\" },
                      { \"type\": \"mrkdwn\", \"text\": \"*👤 Responsible*\n\`${{ github.actor }}\`\" },
                      { \"type\": \"mrkdwn\", \"text\": \"*🔖 Commit*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|\`${{ steps.commit_info.outputs.sha_short }}\`>\" }
                    ]
                  },
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*💬 Commit that caused the failure*\n> ${{ steps.commit_info.outputs.message }}\"
                    }
                  },
                  {
                    \"type\": \"actions\",
                    \"elements\": [
                      {
                        \"type\": \"button\",
                        \"text\": { \"type\": \"plain_text\", \"text\": \"🔎 View Logs\", \"emoji\": true },
                        \"style\": \"danger\",
                        \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                      },
                      {
                        \"type\": \"button\",
                        \"text\": { \"type\": \"plain_text\", \"text\": \"📂 View Commit\", \"emoji\": true },
                        \"url\": \"${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}\"
                      }
                    ]
                  },
                  {
                    \"type\": \"context\",
                    \"elements\": [
                      { \"type\": \"mrkdwn\", \"text\": \"🕐 ${{ steps.commit_info.outputs.timestamp }}  •  Run ID: \`${{ github.run_id }}\`\" }
                    ]
                  }
                ]
              }
            ]
          }" \
          ${{ secrets.SLACK_WEBHOOK }}
